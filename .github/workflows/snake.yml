name: snake

# 프로필 잔디를 뱀이 먹는 그림(Platane/snk)을 만들어 output 브랜치에 올린다.
# 매일 한국 시각 09:00에 새로 그리고, 이 파일을 바꾸거나 직접 실행해도 다시 그린다.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 잔디 뱀 그림 만들기
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: output 브랜치에 올리기
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
