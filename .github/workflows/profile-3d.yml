name: profile-3d

# 프로필 잔디를 3D로 그린 그림(yoshi389111/github-profile-3d-contrib)을 만들어
# profile-3d-contrib/ 폴더에 커밋한다. 매일 한국 시각 09:00과, 이 파일이 바뀌거나
# 직접 실행할 때 다시 그린다.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-3d.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 3D 잔디 그림 만들기
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 레이더 · 원그래프 · 숫자 줄 지우기
        run: python3 .github/scripts/strip-3d.py profile-3d-contrib/profile-green-animate.svg profile-3d-contrib/profile-night-green.svg

      - name: 바뀐 그림 커밋
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: 3D 잔디 그림 갱신"; then
            git push
          fi
