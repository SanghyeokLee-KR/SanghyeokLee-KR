name: style-gate

# 재사용 워크플로. 다른 저장소에서 아래처럼 부른다.
#
#   jobs:
#     style:
#       uses: SanghyeokLee-KR/SanghyeokLee-KR/.github/workflows/style-gate.yml@main
#
# 검사 대상은 이번 변경분뿐이다. 과거 문서까지 소급 검사하면 매번 빨간불이라
# 게이트가 무시된다. 새로 들어오는 위반만 막는 것이 목적이다.

on:
  workflow_call:
    inputs:
      base_ref:
        description: 비교 기준. 비우면 PR 대상 브랜치나 직전 커밋을 쓴다
        type: string
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 파일 목록 산출
        id: diff
        shell: bash
        run: |
          set -eu
          if [ -n "${{ inputs.base_ref }}" ]; then
            BASE="${{ inputs.base_ref }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "기준: $BASE"
          git diff --name-only --diff-filter=ACMR "$BASE"...HEAD > changed.txt || git diff --name-only --diff-filter=ACMR "$BASE" HEAD > changed.txt
          wc -l < changed.txt

      - name: 문서 표기 검사
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys, unicodedata

          EM, EN = '—', '–'
          # 서드파티 원문과 벤더 경로는 원문을 보존해야 하므로 검사하지 않는다
          SKIP_PARTS = ('node_modules/', '/libs/', '/vendor/', 'build/', 'dist/', 'target/')
          SKIP_NAMES = ('LICENSE', 'LICENSE.md', 'LICENSE.txt', 'NOTICE', 'COPYING')
          # 제품 UI 출력과 콘솔 화면에 쓰는 문자는 장식이 아니다
          KEEP = set('★☆✔✓→←↔↑↓·※│─═╔╗╚╝║┌┐└┘├┤┬┴┼')

          def decor(c):
              if c in KEEP:
                  return False
              o = ord(c)
              return (0x1F300 <= o <= 0x1FAFF) or (0x2600 <= o <= 0x27BF) or (0x2B00 <= o <= 0x2BFF) or o == 0xFE0F

          bad = []
          for rel in open('changed.txt', encoding='utf-8').read().splitlines():
              rel = rel.strip()
              if not rel or not rel.lower().endswith(('.md', '.txt', '.mdx')):
                  continue
              p = '/' + rel
              if any(s in p for s in SKIP_PARTS) or os.path.basename(rel) in SKIP_NAMES:
                  continue
              if not os.path.exists(rel):
                  continue
              t = open(rel, encoding='utf-8', errors='ignore').read()
              incode = False
              for i, line in enumerate(t.replace('\r\n', '\n').split('\n'), 1):
                  if line.lstrip().startswith('```'):
                      incode = not incode
                      continue
                  if incode:
                      continue
                  if EM in line:
                      bad.append('%s:%d  em dash. 가운뎃점·콜론·쉼표로 바꾼다' % (rel, i))
                  if EN in line:
                      bad.append('%s:%d  en dash. 물결이나 가운뎃점으로 바꾼다' % (rel, i))
                  e = [c for c in line if decor(c)]
                  if e:
                      bad.append('%s:%d  장식 기호 %s. 문서에서 제거한다' % (rel, i, ''.join(sorted(set(e)))))

          if bad:
              print('문서 표기 위반 %d건' % len(bad))
              for b in bad[:60]:
                  print('  ' + b)
              if len(bad) > 60:
                  print('  ... 외 %d건' % (len(bad) - 60))
              sys.exit(1)
          print('문서 표기 검사 통과')
          PY

      - name: 커밋 메시지 검사
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)..HEAD"
          fi
          MSGS="$(git log --format=%B "$RANGE" || true)"
          FAIL=0
          for pat in 'Co-Authored-By' 'Co-authored-by: Claude' 'Co-authored-by: Cursor' 'Generated with' 'noreply@anthropic.com' 'cursoragent@cursor.com'; do
            if printf '%s' "$MSGS" | grep -qiF "$pat"; then
              echo "커밋 메시지에 도구 서명: $pat"
              FAIL=1
            fi
          done
          if printf '%s' "$MSGS" | grep -qP '\x{2014}|\x{2013}'; then
            echo "커밋 메시지에 긴 대시. 제목·본문에서 제거한다"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "커밋 메시지 검사 통과"
